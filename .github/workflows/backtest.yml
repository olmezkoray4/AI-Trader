name: AI-Trader Backtest

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/backtest.yml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall app

      - name: Run V1 backtest
        run: |
          python -m app.test_backtest | tee backtest_v1_output.txt

      - name: Run V2 backtest
        run: |
          python -m app.test_backtest_v2 | tee backtest_v2_output.txt

      - name: Upload backtest outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-outputs
          path: |
            backtest_v1_output.txt
            backtest_v2_output.txt
          if-no-files-found: warn
